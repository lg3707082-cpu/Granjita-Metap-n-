<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#16834f"><title>Granjita Metapán LR</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f5;color:#17362a}header{background:#16834f;color:#fff;padding:16px;position:sticky;top:0;z-index:10}header b{font-size:18px}header small{display:block;margin-top:4px}.main{max-width:850px;margin:auto;padding:14px 14px 100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.stat{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 9px #0001;margin:10px 0}.stat b{display:block;font-size:21px;margin-top:5px}.btn,.action{border:0;border-radius:13px;padding:13px 15px;background:#16834f;color:#fff;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer;font-size:15px}.btn{display:block;width:100%;text-align:left}.btn .ic{font-size:25px;display:block;margin-bottom:6px}.secondary{background:#e7f1eb;color:#17362a}.danger{background:#b42318!important;color:#fff!important}.warning{background:#fff0c2;color:#614800}.small{padding:8px 10px;font-size:13px}input,select,textarea{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #cbd8d1;border-radius:10px;font-size:16px;background:#fff}label{font-weight:700;font-size:14px}h2{margin:8px 0 14px}h3{margin:4px 0 8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0ee}.row:last-child{border-bottom:0}.muted{color:#708079;font-size:13px}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e7f4ed;font-size:12px}.empty{text-align:center;padding:22px;color:#74827d}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:6px 2px;display:flex;justify-content:space-around;z-index:20}.navbtn{border:0;background:transparent;color:#18352b;min-width:54px;padding:5px 2px;font-size:21px;display:flex;flex-direction:column;align-items:center;gap:2px}.navbtn small{font-size:10px;font-weight:700}.navbtn.active{color:#16834f}.notice{padding:11px;border-radius:10px;background:#fff7d6;margin:10px 0}.success{padding:11px;border-radius:10px;background:#e8f7ee;margin:10px 0}.dangerbox{padding:11px;border-radius:10px;background:#fdecec;margin:10px 0}.two{display:flex;gap:8px}.two>*{flex:1}.right{text-align:right}@media(min-width:650px){.bottom{position:static}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<header><b>🐔 GRANJITA METAPÁN LR</b><small>Control completo de tu granja, pedidos, ventas y ganancias</small></header><main id="app" class="main"></main>
<nav class="bottom"><button class="navbtn" data-n="inicio" onclick="go('inicio')">🏠<small>Inicio</small></button><button class="navbtn" data-n="lotes" onclick="go('lotes')">🐔<small>Lotes</small></button><button class="navbtn" data-n="clientes" onclick="go('clientes')">👥<small>Clientes</small></button><button class="navbtn" data-n="pedidos" onclick="go('pedidos')">📝<small>Pedidos</small></button><button class="navbtn" data-n="ventas" onclick="go('ventas')">💵<small>Ventas</small></button></nav>
<script>
const KEY='granjita_lr_v4';
const defaults={lotes:[],gastos:[],clientes:[],pedidos:[],ventas:[],pesos:[],preparaciones:[],insumoCompras:[],insumoConsumos:[],settings:{retail:1.95,store:1.75,ground:3.25,menudo:1}};
let d=load(); function load(){let x=null;try{x=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){} if(!x)x=JSON.parse(JSON.stringify(defaults)); for(const k of Object.keys(defaults))if(x[k]===undefined)x[k]=JSON.parse(JSON.stringify(defaults[k])); if(!x.settings)x.settings={...defaults.settings}; return x}
function save(){localStorage.setItem(KEY,JSON.stringify(d))} const $=id=>document.getElementById(id); const money=x=>'$'+(Number(x)||0).toFixed(2); const today=()=>new Date().toISOString().slice(0,10); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function go(page,params=''){location.hash='#'+page+(params?'?'+params:'')} function qs(){return new URLSearchParams(location.hash.split('?')[1]||'')} function active(n){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.n===n))}
function shell(title,body){$('app').innerHTML='<button class="action secondary small" onclick="go(\'inicio\')">← Inicio</button><h2>'+title+'</h2>'+body}
function lotInfo(l){let gs=d.gastos.filter(x=>String(x.loteId)===String(l.id)).reduce((s,x)=>s+(+x.total||0),0),sharedCost=d.insumoConsumos.reduce((sum,c)=>sum+(c.allocations||[]).filter(a=>String(a.loteId)===String(l.id)).reduce((z,a)=>z+(+a.cost||0),0),0),sold=+l.sold||0,dead=+l.dead||0,initial=+l.chicks||0,available=Math.max(0,initial-dead-sold);let committed=d.pedidos.filter(o=>String(o.loteId)===String(l.id)&&o.status!=='Entregado').reduce((s,o)=>s+(+o.chicks||0),0);return{gs,sharedCost,cost:initial*(+l.price||0)+gs+sharedCost,sold,dead,initial,available,committed,free:Math.max(0,available-committed)}}
function render(){let p=location.hash.replace(/^#/,'').split('?')[0]||'inicio';let map={inicio,lotes,nuevoLote,lote:detalleLote,clientes,nuevoCliente,cliente:detalleCliente,pedidos,nuevoPedido,pedido:detallePedido,preparacion,entrega,entregas,gastos,nuevoGasto,mortalidad,nuevoPeso,pesos,ventas,nuevaVenta,ganancias,precios,backup,insumos,nuevaCompraInsumo,consumoInsumos,consumoExacto,consumoEstimado};if(!map[p])p='inicio';active(['inicio','lotes','clientes','pedidos','ventas'].includes(p)?p:'');map[p]();}
function inicio(){let sales=d.ventas.reduce((s,x)=>s+(+x.total||0),0),cost=d.lotes.reduce((s,l)=>s+lotInfo(l).cost,0),free=d.lotes.reduce((s,l)=>s+lotInfo(l).free,0),pending=d.pedidos.filter(x=>x.status!=='Entregado').length; $('app').innerHTML='<h2>Resumen</h2><div class="stats"><div class="stat">🐔 Lotes<b>'+d.lotes.length+'</b></div><div class="stat">🐥 Libres<b>'+free+'</b></div><div class="stat">📝 Pendientes<b>'+pending+'</b></div><div class="stat">💵 Ventas<b>'+money(sales)+'</b></div></div><div class="card"><h3>📊 Resultado</h3><p>Costos acumulados: <b>'+money(cost)+'</b></p><p>Ventas: <b>'+money(sales)+'</b></p><p>Resultado: <b>'+money(sales-cost)+'</b></p></div><h2>Módulos</h2><div class="grid">'+[['🐔','Lotes','lotes'],['💰','Gastos','gastos'],['⚰️','Mortalidad','mortalidad'],['⚖️','Pesos','pesos'],['👥','Clientes','clientes'],['📝','Pedidos','pedidos'],['🥩','Preparación','preparacion'],['🚚','Entregas','entregas'],['💵','Ventas','ventas'],['📊','Ganancias','ganancias'],['💲','Precios','precios'],['📦','Inventario de insumos','insumos'],['💾','Respaldo','backup']].map(a=>'<button class="btn" onclick="go(\''+a[2]+'\')"><span class="ic">'+a[0]+'</span>'+a[1]+'</button>').join('')+'</div><div class="notice">💡 Esta aplicación guarda los datos en este teléfono. Usa siempre esta misma versión.</div>'}
function lotes(){shell('🐔 Lotes','<a class="action" href="#" onclick="go(\'nuevoLote\');return false">➕ Nuevo lote</a><div class="card">'+(d.lotes.map(l=>{let i=lotInfo(l);return '<div class="row"><div><b>Lote #'+esc(l.n)+'</b><br><span class="muted">'+esc(l.date)+' · '+i.initial+' iniciales · '+i.free+' libres · '+i.committed+' comprometidos</span></div><button class="action small" onclick="go(\'lote\',\'id='+l.id+'\')">Abrir</button></div>'}).join('')||'<div class="empty">Aún no hay lotes.</div>')+'</div>')}
function nuevoLote(){shell('➕ Nuevo lote','<div class="card"><label>Fecha de compra<input id="ld" type="date" value="'+today()+'"></label><label>Proveedor<input id="lp"></label><label>Cantidad de pollitos<input id="lc" type="number" min="1" value="60"></label><label>Precio por pollito<input id="lpr" type="number" min="0" step="0.01"></label><label>Observaciones<textarea id="lo"></textarea></label><button class="action" onclick="createLot()">💾 Guardar lote</button></div>')}
function createLot(){let chicks=+$('lc').value||0;if(chicks<1){alert('Escribe la cantidad de pollitos.');return}let n=String((Math.max(0,...d.lotes.map(x=>+x.n||0))+1)).padStart(3,'0');d.lotes.push({id:Date.now(),n,date:$('ld').value,provider:$('lp').value,chicks,price:+$('lpr').value||0,dead:0,sold:0,note:$('lo').value});save();alert('✅ Lote guardado.');go('lotes')}
function detalleLote(){let l=d.lotes.find(x=>String(x.id)===String(qs().get('id')));if(!l){shell('Lote','<div class="card">Lote no encontrado.</div>');return}let i=lotInfo(l);shell('🐔 Lote #'+l.n,'<div class="stats"><div class="stat">Iniciales<b>'+i.initial+'</b></div><div class="stat">Muertos<b>'+i.dead+'</b></div><div class="stat">Vendidos<b>'+i.sold+'</b></div><div class="stat">Libres<b>'+i.free+'</b></div></div><div class="card"><p>Fecha: <b>'+esc(l.date)+'</b></p><p>Proveedor: <b>'+esc(l.provider||'—')+'</b></p><p>Precio/pollito: <b>'+money(l.price)+'</b></p><p>Costo pollitos: <b>'+money(i.initial*l.price)+'</b></p><p>Otros gastos directos: <b>'+money(i.gs)+'</b></p><p>Insumos compartidos asignados: <b>'+money(i.sharedCost||0)+'</b></p><p><b>Costo acumulado: '+money(i.cost)+'</b></p></div><div class="grid"><button class="btn" onclick="go(\'gastos\',\'lote='+l.id+'\')">💰 Gastos</button><button class="btn" onclick="go(\'mortalidad\',\'lote='+l.id+'\')">⚰️ Mortalidad</button><button class="btn" onclick="go(\'nuevoPeso\',\'lote='+l.id+'\')">⚖️ Nuevo peso</button><button class="btn" onclick="go(\'pesos\',\'lote='+l.id+'\')">📈 Historial de pesos</button><button class="btn" onclick="go(\'preparacion\',\'lote='+l.id+'\')">🥩 Preparación</button></div><div class="card"><button class="action danger" onclick="deleteLot('+l.id+')">🗑️ Eliminar lote</button></div>')}
function deleteLot(id){if(!confirm('¿Eliminar este lote y sus datos relacionados?'))return;d.lotes=d.lotes.filter(x=>x.id!=id);d.gastos=d.gastos.filter(x=>x.loteId!=id);d.pesos=d.pesos.filter(x=>x.loteId!=id);save();go('lotes')}

function insumoRemaining(b){return Math.max(0,(+b.qty||0)-d.insumoConsumos.filter(c=>String(c.batchId)===String(b.id)).reduce((s,c)=>s+(+c.qty||0),0))}
function insumos(){let batches=d.insumoCompras||[],totalValue=batches.reduce((s,b)=>s+(+b.qty||0)*(+b.unitPrice||0),0),availableValue=batches.reduce((s,b)=>s+insumoRemaining(b)*(+b.unitPrice||0),0);shell('📦 Inventario compartido de insumos','<div class="stats"><div class="stat">Compras registradas<b>'+money(totalValue)+'</b></div><div class="stat">Valor disponible<b>'+money(availableValue)+'</b></div></div><div class="grid"><button class="btn" onclick="go(\'nuevaCompraInsumo\')"><span class="ic">🛒</span>Registrar compra</button><button class="btn" onclick="go(\'consumoInsumos\')"><span class="ic">🐔</span>Asignar consumo a lotes</button></div><div class="card"><h3>Existencias por compra</h3>'+(batches.map(b=>'<div class="row"><span><b>'+esc(b.name)+'</b><br><span class="muted">'+esc(b.qty)+' '+esc(b.unit)+' comprados · '+money(b.unitPrice)+' por '+esc(b.unit)+' · '+esc(b.date)+'</span><br><span class="muted">Disponible: '+insumoRemaining(b).toFixed(2)+' '+esc(b.unit)+'</span></span><button class="action danger small" onclick="deleteInsumoCompra('+b.id+')">Borrar</button></div>').join('')||'<div class="empty">Todavía no hay compras de insumos.</div>')+'</div><div class="card"><h3>Historial de consumos</h3>'+((d.insumoConsumos||[]).slice().reverse().map(c=>'<div class="row"><span><b>'+esc(c.name)+'</b> · '+esc(c.qty)+' '+esc(c.unit)+'<br><span class="muted">'+esc(c.date)+' · '+(c.mode==='estimated'?'Reparto estimado':'Cantidad exacta')+' · '+(c.allocations||[]).map(a=>'Lote #'+esc((d.lotes.find(l=>String(l.id)===String(a.loteId))||{}).n||'?')+' '+money(a.cost)).join(', ')+'</span></span><button class="action danger small" onclick="deleteInsumoConsumo('+c.id+')">Borrar</button></div>').join('')||'<div class="empty">Todavía no hay consumos registrados.</div>')+'</div>')}
function nuevaCompraInsumo(){shell('🛒 Registrar compra de insumos','<div class="card"><label>Fecha de compra<input id="icd" type="date" value="'+today()+'"></label><label>Insumo<input id="icn" placeholder="Ej. Concentrado crecimiento, Electrolit"></label><label>Categoría<select id="icc"><option>Concentrado</option><option>Granza</option><option>Electrolit</option><option>Vitaminas</option><option>Medicamento</option><option>Vacunas</option><option>Otro</option></select></label><label>Cantidad comprada<input id="icq" type="number" min="0.01" step="0.01" value="1"></label><label>Unidad<select id="icu"><option>saco</option><option>unidad</option><option>sobre</option><option>botella</option><option>frasco</option><option>libra</option><option>kilogramo</option><option>litro</option></select></label><label>Precio por unidad ($)<input id="icp" type="number" min="0" step="0.01" value="0"></label><label>Total de la compra ($)<input id="ict" type="number" min="0" step="0.01" value="0"></label><label>Proveedor / nota<input id="icn2"></label><button class="action" onclick="saveInsumoCompra()">💾 Guardar compra</button></div><div class="notice">Cada compra queda separada, incluso si compras el mismo producto a otro precio. Solo se carga como costo del lote lo que se consume y se asigna.</div>');$('icq').addEventListener('input',calcInsumoPurchase);$('icp').addEventListener('input',calcInsumoPurchase);$('ict').addEventListener('input',()=>{})}
function calcInsumoPurchase(){$('ict').value=((+$('icq').value||0)*(+$('icp').value||0)).toFixed(2)}
function saveInsumoCompra(){let name=$('icn').value.trim(),qty=+$('icq').value||0,unit=$('icu').value,total=+$('ict').value||0;if(!name||qty<=0){alert('Escribe el nombre del insumo y una cantidad válida.');return}let unitPrice=total/qty;d.insumoCompras.push({id:Date.now(),date:$('icd').value,name,category:$('icc').value,qty,unit,unitPrice,total,notes:$('icn2').value});save();alert('Compra guardada en el inventario compartido.');go('insumos')}
function deleteInsumoCompra(id){if(d.insumoConsumos.some(c=>String(c.batchId)===String(id))){alert('Esta compra ya tiene consumos asignados. Borra primero esos consumos para poder eliminar la compra.');return}if(!confirm('¿Borrar esta compra del historial?'))return;d.insumoCompras=d.insumoCompras.filter(b=>b.id!==id);save();go('insumos')}
function consumoInsumos(){let batches=(d.insumoCompras||[]).filter(b=>insumoRemaining(b)>0),lots=d.lotes||[];shell('🐔 Asignar consumo a lotes','<div class="card"><p>Elige cómo quieres registrar el consumo de concentrado, Electrolit, vitaminas u otros insumos.</p><button class="action" onclick="go(\'consumoExacto\')">✅ Registrar cantidad exacta</button><p class="muted">Cuando sabes cuánto utilizó un lote en concreto.</p><button class="action secondary" onclick="go(\'consumoEstimado\')">⚖️ Repartir consumo estimado</button><p class="muted">Cuando sabes cuánto se consumió en total, pero necesitas repartir el costo entre varios lotes.</p><button class="action secondary" onclick="go(\'insumos\')">← Volver al inventario</button></div>'+(batches.length&&lots.length?'':'<div class="notice">Para registrar consumo necesitas al menos una compra con existencias y un lote creado.</div>'))}
function consumoExacto(){let batches=(d.insumoCompras||[]).filter(b=>insumoRemaining(b)>0),lots=d.lotes||[];if(!batches.length||!lots.length){consumoInsumos();return}shell('✅ Consumo exacto por lote','<div class="card"><label>Fecha<input id="ced" type="date" value="'+today()+'"></label><label>Compra / insumo<select id="ceb">'+batches.map(b=>'<option value="'+b.id+'">'+esc(b.name)+' — quedan '+insumoRemaining(b).toFixed(2)+' '+esc(b.unit)+' a '+money(b.unitPrice)+'/'+esc(b.unit)+'</option>').join('')+'</select></label><label>Lote que lo utilizó<select id="cel">'+lots.map(l=>'<option value="'+l.id+'">Lote #'+esc(l.n)+'</option>').join('')+'</select></label><label>Cantidad utilizada<input id="ceq" type="number" min="0.01" step="0.01"></label><button class="action" onclick="saveExactConsumption()">Guardar consumo exacto</button></div>')}
function saveExactConsumption(){let b=d.insumoCompras.find(x=>x.id==$('ceb').value),l=d.lotes.find(x=>x.id==$('cel').value),qty=+$('ceq').value||0;if(!b||!l||qty<=0){alert('Revisa el insumo, el lote y la cantidad.');return}if(qty>insumoRemaining(b)+0.0001){alert('La cantidad supera las existencias disponibles.');return}let cost=qty*(+b.unitPrice||0);d.insumoConsumos.push({id:Date.now(),batchId:b.id,name:b.name,unit:b.unit,date:$('ced').value,qty,mode:'exact',allocations:[{loteId:l.id,qty,cost,percent:100}]});save();alert('Consumo asignado al Lote #'+l.n+'. Costo: '+money(cost));go('insumos')}
function consumoEstimado(){let batches=(d.insumoCompras||[]).filter(b=>insumoRemaining(b)>0),lots=d.lotes||[];if(!batches.length||lots.length<1){consumoInsumos();return}shell('⚖️ Reparto estimado entre lotes','<div class="card"><label>Fecha<input id="ced" type="date" value="'+today()+'"></label><label>Compra / insumo<select id="ceb">'+batches.map(b=>'<option value="'+b.id+'">'+esc(b.name)+' — quedan '+insumoRemaining(b).toFixed(2)+' '+esc(b.unit)+' a '+money(b.unitPrice)+'/'+esc(b.unit)+'</option>').join('')+'</select></label><label>Cantidad total consumida<input id="ceq" type="number" min="0.01" step="0.01"></label><p class="muted">Reparte el consumo con porcentajes aproximados. La suma debe ser 100%. El costo se distribuye según esos porcentajes.</p>'+lots.map(l=>'<label>Lote #'+esc(l.n)+' — porcentaje (%)<input class="estpct" data-lote="'+l.id+'" type="number" min="0" max="100" step="1" value="'+(Math.floor(100/lots.length))+'"></label>').join('')+'<button class="action" onclick="saveEstimatedConsumption()">Guardar reparto estimado</button></div>')}
function saveEstimatedConsumption(){let b=d.insumoCompras.find(x=>x.id==$('ceb').value),qty=+$('ceq').value||0,pcts=[...document.querySelectorAll('.estpct')].map(el=>({loteId:el.dataset.lote,percent:+el.value||0})),sum=pcts.reduce((s,x)=>s+x.percent,0);if(!b||qty<=0){alert('Revisa el insumo y la cantidad consumida.');return}if(qty>insumoRemaining(b)+0.0001){alert('La cantidad supera las existencias disponibles.');return}if(Math.abs(sum-100)>0.01){alert('Los porcentajes deben sumar exactamente 100%. Ahora suman '+sum+'%.');return}let totalCost=qty*(+b.unitPrice||0),allocations=pcts.filter(a=>a.percent>0).map(a=>({loteId:+a.loteId,percent:a.percent,qty:qty*a.percent/100,cost:totalCost*a.percent/100}));d.insumoConsumos.push({id:Date.now(),batchId:b.id,name:b.name,unit:b.unit,date:$('ced').value,qty,mode:'estimated',allocations});save();alert('Consumo repartido entre '+allocations.length+' lote(s). Costo asignado: '+money(totalCost));go('insumos')}
function deleteInsumoConsumo(id){if(!confirm('¿Borrar este consumo? Se devolverá esa cantidad al inventario y se quitará su costo de los lotes.'))return;d.insumoConsumos=d.insumoConsumos.filter(c=>c.id!==id);save();go('insumos')}

function gastos(){let l=d.lotes.find(x=>x.id==qs().get('lote'));if(!l){shell('💰 Gastos','<div class="card">Primero entra a un lote.</div>');return}let arr=d.gastos.filter(x=>x.loteId==l.id),tot=arr.reduce((s,x)=>s+(+x.total||0),0);shell('💰 Gastos — Lote #'+l.n,'<a class="action" href="#" onclick="go(\'nuevoGasto\',\'lote='+l.id+'\');return false">➕ Agregar gasto</a><div class="card"><h3>Total: '+money(tot)+'</h3>'+(arr.map(x=>'<div class="row"><span><b>'+esc(x.category)+'</b><br><span class="muted">'+esc(x.desc)+' · '+esc(x.date)+'</span></span><span class="right"><b>'+money(x.total)+'</b><br><button class="action secondary small" onclick="editExpense('+x.id+','+l.id+')">Corregir</button> <button class="action danger small" onclick="deleteExpense('+x.id+','+l.id+')">Borrar</button></span></div>').join('')||'<div class="empty">No hay gastos.</div>')+'</div><button class="action secondary" onclick="go(\'lote\',\'id='+l.id+'\')">← Volver al lote</button>')}
function editExpense(id,lid){let x=d.gastos.find(v=>v.id==id);if(!x)return;shell('✏️ Corregir gasto','<div class="card"><label>Fecha<input id="egd" type="date" value="'+esc(x.date)+'"></label><label>Categoría<select id="egc">'+['Concentrado','Granza','Electrolit','Vitaminas','Medicamento','Transporte','Agua','Otro'].map(v=>'<option '+(v===x.category?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Descripción<input id="egx" value="'+esc(x.desc)+'"></label><label>Cantidad<input id="egq" type="number" step="0.01" value="'+x.qty+'"></label><label>Precio unitario<input id="egp" type="number" step="0.01" value="'+x.price+'"></label><label>Total<input id="egt" type="number" step="0.01" value="'+x.total+'"></label><button class="action" onclick="saveExpenseEdit('+id+','+lid+')">Guardar corrección</button></div>')}

function nuevoGasto(){let l=d.lotes.find(x=>x.id==qs().get('lote'));if(!l){go('lotes');return}shell('➕ Nuevo gasto — Lote #'+l.n,'<div class="card"><label>Fecha<input id="gd" type="date" value="'+today()+'"></label><label>Categoría<select id="gc"><option>Concentrado</option><option>Granza</option><option>Electrolit</option><option>Vitaminas</option><option>Medicamento</option><option>Transporte</option><option>Agua</option><option>Otro</option></select></label><label>Descripción<input id="gx"></label><label>Cantidad<input id="gq" type="number" step="0.01" value="1"></label><label>Precio unitario<input id="gp" type="number" step="0.01"></label><label>Total<input id="gt" type="number" step="0.01"></label><button class="action" onclick="createExpense('+l.id+')">💾 Guardar gasto</button></div>');$('gt').addEventListener('input',()=>{});$('gq').addEventListener('input',calcG);$('gp').addEventListener('input',calcG)}

function saveClientEdit(id){let c=d.clientes.find(x=>x.id==id),n=$('ecn').value.trim();if(!c||!n){alert('Escribe el nombre.');return}c.name=n;c.phone=$('ecp').value;c.address=$('eca').value;c.zone=$('ecz').value;c.type=$('ect').value;c.note=$('eco').value;d.pedidos.forEach(o=>{if(o.customerId==id)o.customer=n});d.ventas.forEach(v=>{if(v.customerId==id)v.customer=n});save();alert('Cliente corregido y actualizado en el historial.');go('cliente','id='+id)}
function deleteClient(id){let c=d.clientes.find(x=>x.id==id);if(!c)return;if(!confirm('¿Borrar a '+c.name+' y también sus pedidos y ventas relacionados? Esta acción no se puede deshacer.'))return;let ids=d.pedidos.filter(o=>o.customerId==id).map(o=>o.id);d.pedidos.filter(o=>ids.includes(o.id)&&o.status==='Entregado').forEach(o=>{let l=d.lotes.find(x=>x.id==o.loteId);if(l)l.sold=Math.max(0,(+l.sold||0)-(+o.chicks||0))});d.ventas=d.ventas.filter(v=>v.customerId!=id&&!ids.includes(v.orderId));d.preparaciones=d.preparaciones.filter(p=>!ids.includes(p.pedidoId));d.pedidos=d.pedidos.filter(o=>o.customerId!=id);d.clientes=d.clientes.filter(x=>x.id!=id);save();go('clientes')}
function nuevoCliente(){shell('➕ Nuevo cliente','<div class="card"><label>Nombre<input id="cn"></label><label>WhatsApp<input id="cp"></label><label>Dirección<input id="ca"></label><label>Zona/comunidad<input id="cz"></label><label>Tipo<select id="ct"><option>Particular</option><option>Tienda/Negocio</option></select></label><label>Notas<textarea id="co"></textarea></label><button class="action" onclick="createClient()">💾 Guardar cliente</button></div>')}

function detalleCliente(){let c=d.clientes.find(x=>x.id==qs().get('id'));if(!c){shell('Cliente','<div class="card">No encontrado.</div>');return}let orders=d.pedidos.filter(o=>o.customerId==c.id);shell('👥 '+esc(c.name),'<div class="card"><p>WhatsApp: <b>'+esc(c.phone||'—')+'</b></p><p>Dirección: <b>'+esc(c.address||'—')+'</b></p><p>Zona: <b>'+esc(c.zone||'—')+'</b></p><p>Tipo: <b>'+esc(c.type||'Particular')+'</b></p><button class="action secondary" onclick="editClient('+c.id+')">✏️ Corregir nombre/datos</button> <button class="action danger" onclick="deleteClient('+c.id+')">🗑️ Borrar cliente</button></div><a class="action" href="#" onclick="go(\'nuevoPedido\',\'cliente='+c.id+'\');return false">➕ Nuevo pedido para este cliente</a><div class="card"><h3>Historial</h3>'+(orders.map(o=>'<div class="row"><span>'+esc(o.code)+' · '+esc(o.status)+'</span><span>'+money(o.total||0)+'<br><button class="action small" onclick="go(\'pedido\',\'id='+o.id+'\')">Abrir</button></span></div>').join('')||'<div class="empty">Sin pedidos.</div>')+'</div>')}
function pedidos(){shell('📝 Pedidos','<a class="action" href="#" onclick="go(\'nuevoPedido\');return false">➕ Nuevo pedido</a><div class="card">'+(d.pedidos.map(o=>'<div class="row"><span><b>'+esc(o.code)+'</b> · '+esc(o.customer)+'</span><span><span class="pill">'+esc(o.status)+'</span> <button class="action small" onclick="go(\'pedido\',\'id='+o.id+'\')">Abrir</button></span></div>').join('')||'<div class="empty">No hay pedidos.</div>')+'</div>')}
function nuevoPedido(){let pre=qs().get('cliente'),clients=d.clientes,lots=d.lotes;if(!clients.length||!lots.length){shell('➕ Nuevo pedido','<div class="card">Necesitas al menos un cliente y un lote.<br><button class="action" onclick="go(\'clientes\')">Clientes</button> <button class="action" onclick="go(\'lotes\')">Lotes</button></div>');return}shell('➕ Nuevo pedido','<div class="card"><label>Cliente<select id="oc">'+clients.map(c=>'<option value="'+c.id+'" '+(c.id==pre?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label><label>Fecha de entrega<input id="od" type="date" value="'+today()+'"></label><label>Lote<select id="ol">'+lots.map(l=>'<option value="'+l.id+'">Lote #'+l.n+' — '+lotInfo(l).free+' libres</option>').join('')+'</select></label><label>Pollos enteros reservados<input id="oq" type="number" min="1" value="1"></label><label>Precio estimado por libra<input id="op" type="number" step="0.01" value="'+d.settings.retail+'"></label><label>Nota<textarea id="on"></textarea></label><button class="action" onclick="createOrder()">💾 Guardar pedido</button></div>')}
function createOrder(){let l=d.lotes.find(x=>x.id==$('ol').value),q=+$('oq').value||0,comm=d.pedidos.filter(o=>o.loteId==l.id&&o.status!=='Entregado').reduce((s,o)=>s+(+o.chicks||0),0),free=lotInfo(l).available-comm;if(q<1||q>free){alert('No hay suficientes pollos libres. Disponibles sin compromiso: '+free);return}let c=d.clientes.find(x=>x.id==$('oc').value);d.pedidos.push({id:Date.now(),code:'#'+String(Math.max(0,...d.pedidos.map(o=>parseInt(o.code?.replace('#',''))||0))+1).padStart(3,'0'),customer:c.name,customerId:c.id,date:$('od').value,loteId:l.id,chicks:q,status:'Pendiente',priceLb:+$('op').value||0,note:$('on').value,total:0});save();alert('✅ Pedido guardado.');go('pedidos')}
function detallePedido(){let o=d.pedidos.find(x=>x.id==qs().get('id'));if(!o){shell('Pedido','<div class="card">No encontrado.</div>');return}let l=d.lotes.find(x=>x.id==o.loteId),rows=(o.chickenWeights||[]).map((w,i)=>'<div class="row"><span><b>Pollo '+(i+1)+'</b><br><span class="muted">Vivo: '+(Number(w.live)||0).toFixed(2)+' lb · Aliñado: '+(Number(w.dress)||0).toFixed(2)+' lb</span></span><b>'+money(w.price||((Number(w.dress)||0)*(Number(w.pricePerLb)||o.priceLb||0)))+'</b></div>').join('');let actions='<button class="btn" onclick="go(\'preparacion\',\'pedido='+o.id+'\')">🥩 Registrar / corregir pesos por pollo</button>'+(o.status==='Listo'?'<button class="btn" onclick="go(\'entrega\',\'pedido='+o.id+'\')">🚚 Entregar y cobrar</button>':'');shell('📝 '+esc(o.code),'<div class="card"><p>Cliente: <b>'+esc(o.customer)+'</b></p><p>Entrega: <b>'+esc(o.date)+'</b></p><p>Lote: <b>#'+esc(l?.n||'?')+'</b></p><p>Pollos: <b>'+o.chicks+'</b></p><p>Estado: <span class="pill">'+esc(o.status)+'</span></p>'+(o.live?'<p>Peso vivo total: <b>'+Number(o.live).toFixed(2)+' lb</b></p><p>Peso aliñado total: <b>'+Number(o.dress).toFixed(2)+' lb</b></p><p>Rendimiento: <b>'+Number(o.yield||0).toFixed(1)+'%</b></p>':'')+(rows?'<h3>Detalle por pollo</h3>'+rows:'')+(o.total!=null&&o.total!==0?'<p>Total cobrado: <b>'+money(o.total)+'</b></p>':'')+'</div><div class="grid">'+actions+'<button class="btn secondary" onclick="editOrder('+o.id+')">✏️ Corregir pedido</button><button class="btn secondary" onclick="advanceStatus('+o.id+')">🔄 Cambiar estado</button><button class="btn danger" onclick="deleteOrder('+o.id+')">🗑️ Borrar pedido e historial relacionado</button></div><button class="action secondary" onclick="go(\'pedidos\')">← Volver a pedidos</button>')}
function editOrder(id){let o=d.pedidos.find(x=>x.id==id);if(!o)return;if(o.status==='Entregado'){alert('Para un pedido entregado, corrige el nombre desde Clientes y los pesos desde Registrar/corregir pesos por pollo. No cambiamos lote ni cantidad para no alterar las cuentas.');return}shell('✏️ Corregir pedido '+esc(o.code),'<div class="card"><label>Cliente<select id="eoc">'+d.clientes.map(c=>'<option value="'+c.id+'" '+(c.id==o.customerId?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></label><label>Fecha de entrega<input id="eod" type="date" value="'+esc(o.date)+'"></label><label>Lote<select id="eol">'+d.lotes.map(l=>'<option value="'+l.id+'" '+(l.id==o.loteId?'selected':'')+'>Lote #'+l.n+' — '+lotInfo(l).free+' libres</option>').join('')+'</select></label><label>Cantidad de pollos<input id="eoq" type="number" min="1" value="'+o.chicks+'"></label><label>Precio por libra ($)<input id="eop" type="number" min="0" step="0.01" value="'+o.priceLb+'"></label><label>Nota<textarea id="eon">'+esc(o.note||'')+'</textarea></label><button class="action" onclick="saveOrderEdit('+id+')">Guardar corrección</button></div>')}
function saveOrderEdit(id){let o=d.pedidos.find(x=>x.id==id),l=d.lotes.find(x=>x.id==$('eol').value),q=+$('eoq').value||0;if(!o||!l||q<1){alert('Revisa lote y cantidad.');return}let committed=d.pedidos.filter(x=>x.id!=id&&x.loteId==l.id&&x.status!=='Entregado').reduce((sum,x)=>sum+(+x.chicks||0),0),free=lotInfo(l).available-committed;if(q>free){alert('Solo hay '+free+' pollos disponibles para reservar en ese lote.');return}let c=d.clientes.find(x=>x.id==$('eoc').value);if(!c){alert('Selecciona cliente.');return}o.customerId=c.id;o.customer=c.name;o.date=$('eod').value;o.loteId=l.id;o.chicks=q;o.priceLb=+$('eop').value||0;o.note=$('eon').value;save();alert('Pedido corregido.');go('pedido','id='+id)}
function deleteOrder(id){let o=d.pedidos.find(x=>x.id==id);if(!o)return;if(!confirm('¿Borrar el pedido '+o.code+'? Se eliminará también su venta e historial de preparación.'))return;if(o.status==='Entregado'){let l=d.lotes.find(x=>x.id==o.loteId);if(l)l.sold=Math.max(0,(+l.sold||0)-(+o.chicks||0))}d.ventas=d.ventas.filter(v=>v.orderId!=id);d.preparaciones=d.preparaciones.filter(p=>p.pedidoId!=id);d.pedidos=d.pedidos.filter(x=>x.id!=id);save();go('pedidos')}
function advanceStatus(id){let o=d.pedidos.find(x=>x.id==id),seq=['Pendiente','Por preparar','Aliñando','Listo'];let i=seq.indexOf(o.status);if(i<0)return;o.status=seq[Math.min(i+1,3)];save();go('pedido','id='+id)}
function preparacion(){let pid=qs().get('pedido'),lid=qs().get('lote'),orders=pid?d.pedidos.filter(o=>o.id==pid):d.pedidos.filter(o=>o.status!=='Entregado'&&(!lid||o.loteId==lid));shell('🥩 Preparación / aliñado',orders.length?orders.map(o=>{if(!Array.isArray(o.chickenWeights))o.chickenWeights=Array.from({length:Math.max(1,+o.chicks||1)},()=>({live:'',dress:''}));while(o.chickenWeights.length<o.chicks)o.chickenWeights.push({live:'',dress:''});let ws=o.chickenWeights.slice(0,o.chicks);return '<div class="card"><h3>'+esc(o.code)+' · '+esc(o.customer)+'</h3><p>'+o.chicks+' pollo(s) · '+esc(o.status)+'</p><label>Precio por libra ($)<input id="rate'+o.id+'" type="number" min="0" step="0.01" value="'+(o.priceLb||d.settings.retail)+'" oninput="updateChickenPrices('+o.id+','+o.chicks+')"></label><div class="notice">Escribe el peso vivo y el peso después de aliñar de cada pollo. El precio se calcula por separado.</div>'+ws.map((w,i)=>'<div class="card"><h3>🐔 Pollo '+(i+1)+'</h3><label>Peso vivo (lb)<input id="clive'+o.id+'_'+i+'" type="number" min="0.01" step="0.01" value="'+(w.live??'')+'" oninput="updateChickenPrices('+o.id+','+o.chicks+')"></label><label>Peso aliñado (lb)<input id="cdress'+o.id+'_'+i+'" type="number" min="0.01" step="0.01" value="'+(w.dress??'')+'" oninput="updateChickenPrices('+o.id+','+o.chicks+')"></label><p>Precio de este pollo: <b id="cprice'+o.id+'_'+i+'">'+money(w.price||0)+'</b></p></div>').join('')+'<div class="success">Total de este pedido: <b id="ctotal'+o.id+'">'+money(o.total||0)+'</b></div><button class="action" onclick="savePrep('+o.id+')">💾 Guardar / corregir pesos y precios</button></div>'}).join(''):'<div class="empty">No hay pedidos para preparar.</div>')}
function updateChickenPrices(id,count){let rate=+$('rate'+id)?.value||0,total=0;for(let i=0;i<count;i++){let pounds=+$('cdress'+id+'_'+i)?.value||0,price=pounds*rate;total+=price;let el=$('cprice'+id+'_'+i);if(el)el.textContent=money(price)}let t=$('ctotal'+id);if(t)t.textContent=money(total)}
function savePrep(id){let o=d.pedidos.find(x=>x.id==id);if(!o)return;let count=+o.chicks||0,rate=+$('rate'+id).value||0,ws=[],live=0,dress=0;for(let i=0;i<count;i++){let lv=+$('clive'+id+'_'+i).value||0,dr=+$('cdress'+id+'_'+i).value||0;if(lv<=0||dr<=0){alert('Completa el peso vivo y el peso aliñado del pollo '+(i+1)+'.');return}if(dr>lv){if(!confirm('El pollo '+(i+1)+' pesa más aliñado que vivo. ¿Quieres guardar de todos modos?'))return}let price=dr*rate;ws.push({number:i+1,live:lv,dress:dr,pricePerLb:rate,price});live+=lv;dress+=dr}let wasDelivered=o.status==='Entregado';o.chickenWeights=ws;o.live=live;o.dress=dress;o.priceLb=rate;o.yield=live?dress/live*100:0;o.total=ws.reduce((sum,w)=>sum+w.price,0);if(!wasDelivered)o.status='Listo';let prep={id:Date.now(),pedidoId:id,date:today(),live,dress,yield:o.yield,chickenWeights:ws,total:o.total};let pi=d.preparaciones.findIndex(p=>p.pedidoId==id);if(pi>=0)d.preparaciones[pi]=prep;else d.preparaciones.push(prep);if(wasDelivered){let sale=d.ventas.find(v=>v.orderId==id);if(sale){sale.qty=dress;sale.price=rate;sale.total=o.total;sale.chickenWeights=ws;sale.date=sale.date||today()}}save();alert('Pesos y precios guardados. Total del pedido: '+money(o.total));go('pedido','id='+id)}
function savePrep(id){let o=d.pedidos.find(x=>x.id==id),live=+$('live'+id).value||0,dress=+$('dress'+id).value||0;if(live<=0||dress<=0){alert('Escribe ambos pesos.');return}o.live=live;o.dress=dress;o.yield=dress/live*100;o.status='Listo';d.preparaciones.push({id:Date.now(),pedidoId:id,date:today(),live,dress,yield:o.yield});save();alert('✅ Listo. Rendimiento '+o.yield.toFixed(1)+'%.');go('pedido','id='+id)}
function entrega(){let o=d.pedidos.find(x=>x.id==qs().get('pedido'));if(!o){shell('🚚 Entrega','<div class="card">Pedido no encontrado.</div>');return}if(o.status!=='Listo'){shell('🚚 Entrega','<div class="card">Primero registra los pesos de cada pollo.</div>');return}let rate=+o.priceLb||d.settings.retail,pounds=+o.dress||0,rows=(o.chickenWeights||[]).map((w,i)=>'<div class="row"><span>Pollo '+(i+1)+' · '+Number(w.dress||0).toFixed(2)+' lb</span><b>'+money(w.price||((+w.dress||0)*rate))+'</b></div>').join('');shell('🚚 Entregar y cobrar','<div class="card"><h3>'+esc(o.code)+' · '+esc(o.customer)+'</h3><p>Peso aliñado total: <b>'+pounds.toFixed(2)+' lb</b></p><h3>Detalle por pollo</h3>'+rows+'<label>Precio por libra ($)<input id="er" type="number" step="0.01" value="'+rate.toFixed(2)+'" oninput="document.getElementById(\'et\').value=('+pounds+'*(+this.value||0)).toFixed(2)"></label><label>Total a cobrar ($)<input id="et" type="number" step="0.01" value="'+(o.total||pounds*rate).toFixed(2)+'"></label><label>Forma de pago<select id="ep"><option>Efectivo</option><option>Transferencia</option><option>Otro</option></select></label><label>Observación<textarea id="eo"></textarea></label><button class="action" onclick="confirmDelivery('+o.id+')">🚚 Confirmar entrega y registrar venta</button></div>')}
function confirmDelivery(id){let o=d.pedidos.find(x=>x.id==id),l=d.lotes.find(x=>x.id==o.loteId),total=+$('et').value||0,rate=+$('er').value||0;if(!l||total<0){alert('Revisa los datos.');return}o.priceLb=rate;o.total=total;o.payment=$('ep').value;o.deliveryNote=$('eo').value;let already=o.status==='Entregado';o.status='Entregado';if(!already)l.sold=(+l.sold||0)+(+o.chicks||0);let sale=d.ventas.find(v=>v.orderId==o.id);let record={id:sale?.id||Date.now(),date:today(),customer:o.customer,customerId:o.customerId,total,loteId:l.id,product:'Pollo entero',qty:o.dress||0,price:rate,payment:o.payment,orderId:o.id,chickenWeights:o.chickenWeights||[]};if(sale)Object.assign(sale,record);else d.ventas.push(record);save();alert('Entrega y venta registradas. Total: '+money(total));go('ventas')}
function entregas(){let arr=d.pedidos.filter(o=>o.status==='Listo');shell('🚚 Entregas',arr.length?arr.map(o=>'<div class="card"><b>'+esc(o.code)+' · '+esc(o.customer)+'</b><p>'+o.dress+' lb · '+o.chicks+' pollo(s)</p><button class="action" onclick="go(\'entrega\',\'pedido='+o.id+'\')">🚚 Entregar y cobrar</button></div>').join(''):'<div class="empty">No hay pedidos listos para entregar.</div>')}
function ventas(){let total=d.ventas.reduce((s,v)=>s+(+v.total||0),0);shell('💵 Ventas','<div class="card"><h2>'+money(total)+'</h2><div class="muted">Ventas acumuladas</div></div><a class="action" href="#" onclick="go(\'nuevaVenta\');return false">➕ Venta manual</a><div class="card">'+(d.ventas.map(v=>'<div class="row"><span><b>'+esc(v.customer)+'</b><br><span class="muted">'+v.date+' · '+esc(v.product||'Venta')+' · '+esc(v.payment||'')+'</span><br><b>'+money(v.total)+'</b></span><span class="right">'+(v.orderId?'<button class="action secondary small" onclick="go(\'pedido\',\'id='+v.orderId+'\')">Ver pedido</button>':'<button class="action secondary small" onclick="editSale('+v.id+')">Corregir</button> <button class="action danger small" onclick="deleteSale('+v.id+')">Borrar</button>')+'</span></div>').join('')||'<div class="empty">No hay ventas.</div>')+'</div>')}
function editSale(id){let v=d.ventas.find(x=>x.id==id);if(!v)return;shell('✏️ Corregir venta','<div class="card"><label>Cliente<input id="esn" value="'+esc(v.customer)+'"></label><label>Fecha<input id="esd" type="date" value="'+esc(v.date)+'"></label><label>Producto<input id="esp" value="'+esc(v.product||'Venta')+'"></label><label>Libras<input id="esq" type="number" step="0.01" value="'+(v.qty||0)+'"></label><label>Precio por libra<input id="esr" type="number" step="0.01" value="'+(v.price||0)+'"></label><label>Total cobrado<input id="est" type="number" step="0.01" value="'+(v.total||0)+'"></label><label>Forma de pago<select id="esm"><option '+(v.payment==='Efectivo'?'selected':'')+'>Efectivo</option><option '+(v.payment==='Transferencia'?'selected':'')+'>Transferencia</option><option '+(v.payment==='Otro'?'selected':'')+'>Otro</option></select></label><button class="action" onclick="saveSaleEdit('+id+')">Guardar corrección</button></div>')}
function saveSaleEdit(id){let v=d.ventas.find(x=>x.id==id);if(!v)return;v.customer=$('esn').value||'Cliente particular';v.date=$('esd').value;v.product=$('esp').value;v.qty=+$('esq').value||0;v.price=+$('esr').value||0;v.total=+$('est').value||0;v.payment=$('esm').value;save();alert('Venta corregida.');go('ventas')}
function deleteSale(id){let v=d.ventas.find(x=>x.id==id);if(!v)return;if(v.orderId){alert('Esta venta pertenece a un pedido. Abre el pedido y usa “Borrar pedido e historial relacionado” para mantener las cuentas correctas.');return}if(!confirm('¿Borrar esta venta del historial?'))return;d.ventas=d.ventas.filter(x=>x.id!=id);save();go('ventas')}
function nuevaVenta(){shell('➕ Venta manual','<div class="card"><label>Cliente<input id="vn"></label><label>Fecha<input id="vd" type="date" value="'+today()+'"></label><label>Producto<input id="vp" value="Pollo"></label><label>Libras<input id="vq" type="number" step="0.01"></label><label>Precio por libra<input id="vr" type="number" step="0.01"></label><label>Forma de pago<select id="vm"><option>Efectivo</option><option>Transferencia</option><option>Otro</option></select></label><button class="action" onclick="saveSale()">💾 Guardar venta</button></div>')}
function saveSale(){let q=+$('vq').value||0,r=+$('vr').value||0;if(q<=0){alert('Escribe las libras.');return}d.ventas.push({id:Date.now(),date:$('vd').value,customer:$('vn').value||'Cliente particular',product:$('vp').value||'Pollo',qty:q,price:r,total:q*r,payment:$('vm').value});save();alert('✅ Venta guardada.');go('ventas')}
function ganancias(){let sales=d.ventas.reduce((s,x)=>s+(+x.total||0),0),cost=d.lotes.reduce((s,l)=>s+lotInfo(l).cost,0),result=sales-cost;shell('📊 Ganancias','<div class="stats"><div class="stat">💵 Ventas<b>'+money(sales)+'</b></div><div class="stat">💰 Costos<b>'+money(cost)+'</b></div><div class="stat">📈 Resultado<b>'+money(result)+'</b></div><div class="stat">🐔 Pollos vendidos<b>'+d.lotes.reduce((s,l)=>s+(+l.sold||0),0)+'</b></div></div><div class="card"><h3>Por lote</h3>'+d.lotes.map(l=>{let i=lotInfo(l),sale=d.ventas.filter(v=>v.loteId==l.id).reduce((s,v)=>s+(+v.total||0),0);return '<div class="row"><span><b>Lote #'+l.n+'</b><br><span class="muted">Costo '+money(i.cost)+' · Ventas '+money(sale)+'</span></span><b>'+money(sale-i.cost)+'</b></div>'}).join('')+'</div>')}
function precios(){shell('💲 Precios','<div class="card"><label>Pollo particular / lb<input id="pr" type="number" step="0.01" value="'+d.settings.retail+'"></label><label>Pollo tienda / lb<input id="ps" type="number" step="0.01" value="'+d.settings.store+'"></label><label>Pollo molido / lb<input id="pg" type="number" step="0.01" value="'+d.settings.ground+'"></label><label>Menudo / lb<input id="pm" type="number" step="0.01" value="'+d.settings.menudo+'"></label><button class="action" onclick="savePrices()">💾 Guardar precios</button></div>')}
function savePrices(){d.settings={retail:+$('pr').value||0,store:+$('ps').value||0,ground:+$('pg').value||0,menudo:+$('pm').value||0};save();alert('✅ Precios guardados.');go('inicio')}
function backup(){shell('💾 Respaldo de datos','<div class="card"><p>Guarda una copia de toda la información de la granjita.</p><button class="action" onclick="exportData()">⬇️ Descargar respaldo</button><hr><label>Restaurar respaldo<input id="file" type="file" accept="application/json"></label><button class="action secondary" onclick="importData()">⬆️ Restaurar datos</button></div><div class="notice">⚠️ Restaurar reemplazará los datos actuales por los del respaldo seleccionado.</div>')}
function exportData(){let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='granjita_metapan_lr_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(){let f=$('file').files[0];if(!f){alert('Selecciona primero un archivo de respaldo.');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.lotes||!x.pedidos){alert('El archivo no parece ser un respaldo válido.');return}if(confirm('¿Reemplazar los datos actuales?')){d=x;save();alert('✅ Respaldo restaurado.');go('inicio')}}catch(e){alert('No se pudo leer el respaldo.')}};r.readAsText(f)}
window.addEventListener('hashchange',render);render();
</script></body></html>
